services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: setustock
      POSTGRES_USER: setustock
      POSTGRES_PASSWORD: ${DB_PASSWORD:-setustock-local}
    volumes:
      - setustock_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setustock"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-docker-only-secret-change-me}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: setustock
      DB_USER: setustock
      DB_PASSWORD: ${DB_PASSWORD:-setustock-local}
      DB_HOST: db
      DB_PORT: 5432
      SECURE_SSL_REDIRECT: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - setustock_media:/app/media
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
        VITE_APP_MODE: production
        VITE_DEMO_FALLBACK: "false"
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  setustock_db:
  setustock_media:
